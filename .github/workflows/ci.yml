name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    name: Lint, test, and build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Zig
        uses: goto-bus-stop/setup-zig@v2
        with:
          version: 0.16.0

      - name: Static checks
        run: bash scripts/lint-amxx.sh

      - name: Fetch dependencies
        run: zig build --fetch

      - name: Host unit tests
        run: zig build test -Dtest-only=true

      - name: Install Linux x86 build dependencies
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y \
            libsqlite3-dev:i386 \
            libssl-dev:i386 \
            zlib1g-dev:i386

      - name: Build AMXX module (Linux x86)
        run: ./build.sh

      - name: Verify artifact
        run: |
          test -f zig-out/lib/kz_global_api_amxx_i386.so
          file zig-out/lib/kz_global_api_amxx_i386.so
